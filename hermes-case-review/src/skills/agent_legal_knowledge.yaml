# 智能体技能配置 - 法律知识与思考能力

## 技能名称
hermes_legal_knowledge

## 技能描述
专业的生态环境法律知识库，集成评查细则、法规汇编、复函、部长信箱回复等权威资料，具备法律条文检索、案卷分析、法律推理等能力。

## 技能类型
knowledge_agent

## 核心能力

### 1. 知识学习能力
- **自动学习**：能够从法律文本中自动提取知识
- **知识关联**：建立法条之间的关联关系
- **知识更新**：支持动态更新法律知识库

### 2. 思考推理能力
- **法律思维**：按照法律逻辑进行推理分析
- **三段论推理**：大前提→小前提→结论
- **类比推理**：相似案例对比分析
- **溯因推理**：从结果追溯原因

### 3. 案卷分析能力
- **法条对标**：将案卷内容与法律条文对应
- **问题发现**：识别案卷中的法律问题
- **建议生成**：基于分析给出改进建议

### 4. 裁量判断能力
- **裁量基准**：掌握各地裁量标准
- **因素分析**：综合考量各种裁量因素
- **金额计算**：根据裁量基准计算罚款

