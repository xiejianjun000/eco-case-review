## 使用方法

### 1. 初始化知识系统
```python
from src.agent_learning import create_agent_with_knowledge

agent = create_agent_with_knowledge()
```

### 2. 分析案卷
```python
result = agent.analyze_case_with_knowledge(
    case_content="案卷内容...",
    case_type="行政处罚"
)
```

### 3. 法律推理
```python
answer = agent.think_legal_question(
    question="某行为是否违法？",
    context="背景信息..."
)
```

### 4. 检索法条
```python
provisions = agent.retrieve_legal_provisions(
    query="超标排放水污染物",
    top_k=5
)
```

## 思考流程

### 法律思维流程
```
问题输入
  ↓
问题理解 → 确定法律关系
  ↓
知识检索 → 匹配相关法条
  ↓
规则应用 → 对照法律规定
  ↓
逻辑推理 → 三段论推理
  ↓
裁量判断 → 确定处罚标准
  ↓
结论输出 → 明确处理建议
```

### 案卷评查流程
```
接收案卷
  ↓
初步阅读 → 了解案件概况
  ↓
法条对标 → 检索适用法条
  ↓
问题分析 → 发现法律问题
  ↓
规范检查 → 检查文书规范
  ↓
裁量评估 → 确定罚款金额
  ↓
形成报告 → 输出评查结论
```

