
name: normative_scoring
description: 生态环境行政处罚案卷规范性评分
version: "4.0"
author: 生态环境案卷评查系统
tags:
  - case_review
  - normative
  - scoring

inputs:
  - name: case_file
    type: file
    description: 案卷PDF文件
    required: true
  - name: legality_passed
    type: boolean
    description: 合法性是否通过
    default: true

steps:
  - tool: llm
    prompt: |
      你是生态环境行政执法案卷规范性评分专家。
      
      评分标准：
      1. 卷面基本要素评查（20分，扣分制）
         - 文书基本要素（10分）
         - 笔录基本要素（10分）
      2. 各类型文书评查（100分→折算50分，得分制）
         - 立案审批表（2分）
         - 现场检查笔录（10分）
         - 调查询问笔录（10分）
         - 监测报告（5分）
         - 其他证据（8分）
         - 案件调查报告（8分）
         - 责令改正决定书（10分）
         - 行政处罚事先告知书（10分）
         - 听证通知书（4分）
         - 听证笔录（8分）
         - 行政处罚决定书（15分）
         - 催告书（2分）
         - 强制执行申请书（5分）
         - 结案审批表（3分）
      
      计算公式：
      规范性得分 = 50 × (文书得分 / 标准分) - 基本要素扣分
      
      请输出详细评分明细表。

  - tool: python
    script: |
      # 规范性评分计算逻辑
      document_score = 85  # 示例
      document_standard = 100
      basic_deduction = 3
      
      normative_score = 50 * (document_score / document_standard) - basic_deduction
      
      print(f"规范性得分: {normative_score}")
    description: 计算规范性得分

outputs:
  - name: normative_score
    type: number
    description: 规范性评分（0-50）
  - name: scoring_detail
    type: file
    description: 评分明细表
