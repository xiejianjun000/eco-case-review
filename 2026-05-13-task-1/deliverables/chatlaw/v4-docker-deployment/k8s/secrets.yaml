apiVersion: v1
kind: Secret
metadata:
  name: v4-review-secrets
  namespace: chatlaw
  labels:
    app: v4-review
    version: v4.0.0
type: Opaque
# ============================================================
# 重要：以下为模板值，部署前必须替换为实际的安全值
#
# 生成方法：
#   SECRET_KEY:      python -c "import secrets; print(secrets.token_urlsafe(48))"
#   DB_PASSWORD:     openssl rand -base64 32
#   或者使用: kubectl create secret generic v4-review-secrets \
#              --from-literal=SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))") \
#              --from-literal=DB_PASSWORD=$(openssl rand -base64 32) \
#              --from-literal=REDIS_PASSWORD=$(openssl rand -base64 24) \
#              -n chatlaw --dry-run=client -o yaml > k8s/secrets.yaml
# ============================================================
stringData:
  SECRET_KEY: "CHANGE_ME_TO_A_RANDOM_SECRET_KEY_AT_LEAST_48_CHARS"
  DB_PASSWORD: "CHANGE_ME_TO_A_STRONG_DATABASE_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_TO_A_REDIS_PASSWORD"
---
# 如果使用 TLS 证书，请替换以下占位符
# 生成自签名证书用于测试:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt -subj "/CN=review.example.com"
#   kubectl create secret tls v4-review-tls \
#     --cert=tls.crt --key=tls.key -n chatlaw
apiVersion: v1
kind: Secret
metadata:
  name: v4-review-tls
  namespace: chatlaw
  labels:
    app: v4-review
    version: v4.0.0
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    PLACEHOLDER_CERTIFICATE_REPLACE_WITH_ACTUAL_CERT
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    PLACEHOLDER_PRIVATE_KEY_REPLACE_WITH_ACTUAL_KEY
    -----END PRIVATE KEY-----
