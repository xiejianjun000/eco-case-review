apiVersion: v1
kind: Service
metadata:
  name: v4-review
  namespace: chatlaw
  labels:
    app: v4-review
    version: v4.0.0
    component: case-review
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8000
      targetPort: metrics
      protocol: TCP
  selector:
    app: v4-review
---
# Prometheus 监控专用的 Service（无 ClusterIP，仅供集群内访问指标）
apiVersion: v1
kind: Service
metadata:
  name: v4-review-metrics
  namespace: chatlaw
  labels:
    app: v4-review
    version: v4.0.0
    component: monitoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
      protocol: TCP
  selector:
    app: v4-review
