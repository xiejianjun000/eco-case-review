# ============================================================
# V4 行政处罚案卷评查系统 - Docker Compose 配置
# 支持开发环境和生产环境
# ============================================================

# 开发环境启动: docker compose up
# 生产环境启动: docker compose --profile prod up -d
# 查看日志:     docker compose logs -f

services:
  # ==========================================
  # 主应用服务
  # ==========================================
  v4-review:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatlaw/v4-review:${IMAGE_TAG:-latest}
    container_name: v4-review
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - OCR_ENGINE=${OCR_ENGINE:-local}
      - MAX_PDF_SIZE=${MAX_PDF_SIZE:-50}
      - MAX_PAGES=${MAX_PAGES:-500}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://v4user:${DB_PASSWORD:-v4pass}@postgres:5432/v4review
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - TZ=Asia/Shanghai
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2Gi
          cpu: "2000m"
        reservations:
          memory: 512Mi
          cpu: "500m"
    networks:
      - v4-network

  # ==========================================
  # Redis 缓存服务
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: v4-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - v4-network

  # ==========================================
  # PostgreSQL 数据库服务
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: v4-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=v4user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-v4pass}
      - POSTGRES_DB=v4review
      - TZ=Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v4user -d v4review"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - v4-network

  # ==========================================
  # Nginx 反向代理（仅生产环境）
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: v4-nginx
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      v4-review:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - v4-network

  # ==========================================
  # Prometheus 监控（仅生产环境）
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: v4-prometheus
    restart: unless-stopped
    profiles:
      - prod
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - v4-network

  # ==========================================
  # Grafana 可视化（仅生产环境）
  # ==========================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: v4-grafana
    restart: unless-stopped
    profiles:
      - prod
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - v4-network

# ==========================================
# 数据卷
# ==========================================
volumes:
  app-data:
    driver: local
  app-logs:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  nginx-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ==========================================
# 网络
# ==========================================
networks:
  v4-network:
    driver: bridge
