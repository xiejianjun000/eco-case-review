# V4 行政处罚案卷评查系统 - Filebeat 日志收集配置

filebeat.inputs:
  # 应用日志收集
  - type: log
    enabled: true
    paths:
      - /app/logs/*.log
      - /app/logs/**/*.log
    json.keys_under_root: true
    json.add_error_key: true
    json.message_key: message
    fields:
      service: v4-review
      environment: production
    fields_under_root: false
    multiline:
      pattern: '^\d{4}-\d{2}-\d{2}'
      negate: true
      match: after
    processors:
      - add_host_metadata:
          when.not.contains.tags: ["forwarded"]
      - add_cloud_metadata: ~
      - add_docker_metadata: ~

  # 错误日志单独收集
  - type: log
    enabled: true
    paths:
      - /app/logs/error*.log
    json.keys_under_root: true
    fields:
      service: v4-review
      log_type: error
    fields_under_root: false

  # 访问日志收集
  - type: log
    enabled: true
    paths:
      - /app/logs/access*.log
    json.keys_under_root: true
    fields:
      service: v4-review
      log_type: access
    fields_under_root: false

# 处理管道配置
processors:
  - add_host_metadata:
      when.not.contains.tags: ["forwarded"]
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata:
      matchers:
        - logs_path:
            logs_path: "/app/logs/"
  - drop_event:
      when:
        regexp:
          message: "^DEBUG"
      fields:
        level: debug
  - rename:
      fields:
        - from: "json.level"
          to: "log.level"
      ignore_missing: true
      fail_on_error: false
  - rename:
      fields:
        - from: "json.timestamp"
          to: "event.timestamp"
      ignore_missing: true
      fail_on_error: false
  - timestamp:
      field: event.timestamp
      layouts:
        - '2006-01-02T15:04:05.000Z'
        - '2006-01-02 15:04:05'
      test:
        - '2024-01-01T12:00:00.000Z'

# 输出到 Elasticsearch
output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "v4-review-%{[agent.version]}-%{+yyyy.MM.dd}"
  pipeline: "v4-review-pipeline"
  username: "${ELASTICSEARCH_USERNAME:}"
  password: "${ELASTICSEARCH_PASSWORD:}"
  ssl.enabled: true
  ssl.certificate_authorities: ["/etc/filebeat/ca.crt"]
  ssl.certificate: "/etc/filebeat/filebeat.crt"
  ssl.key: "/etc/filebeat/filebeat.key"

# 可选：同时输出到 Logstash（用于更复杂的处理）
# output.logstash:
#   hosts: ["logstash:5044"]
#   ssl.enabled: true
#   ssl.certificate_authorities: ["/etc/filebeat/ca.crt"]
#   ssl.certificate: "/etc/filebeat/filebeat.crt"
#   ssl.key: "/etc/filebeat/filebeat.key"

# Kibana 配置（用于仪表盘加载）
setup.kibana:
  host: "kibana:5601"
  username: "${KIBANA_USERNAME:}"
  password: "${KIBANA_PASSWORD:}"

# 仪表盘配置
setup.dashboards:
  enabled: true
  dashboard_id: "v4-review-dashboard-*"
  index: "v4-review-*"
  always_forget: false
  reload: true
  reload_period: 30s

# 索引模板配置
setup.template:
  enabled: true
  name: "v4-review"
  pattern: "v4-review-*"
  settings:
    index.number_of_shards: 1
    index.number_of_replicas: 1
    index.refresh_interval: "5s"
  mappings:
    dynamic: true
    properties:
      "@timestamp":
        type: date
      service:
        type: keyword
      log.level:
        type: keyword
      message:
        type: text
      trace.id:
        type: keyword
      span.id:
        type: keyword
      case.id:
        type: keyword
      review.result:
        type: keyword
      review.score:
        type: float
      review.duration:
        type: float

# 日志级别过滤
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0640

# 队列配置
queue.mem:
  events: 4096
  flush.min_events: 2048
  flush.timeout: "1s"

# 负载限制
max_procs: 4
