# V4 行政处罚案卷评查系统 - Prometheus 配置

global:
  scrape_interval: 15s      # 默认抓取间隔
  evaluation_interval: 15s  # 规则评估间隔
  external_labels:
    cluster: 'v4-review-prod'
    environment: 'production'

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# 规则文件
rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # V4评查系统主服务
  - job_name: 'v4-review-system'
    static_configs:
      - targets: ['v4-review:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'v4-review-system-{{ $labels.instance }}'

  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - 主机资源监控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Alertmanager 监控
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Elasticsearch 集群监控
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: '/_prometheus/metrics'

  # 自定义告警规则（嵌入规则）
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

remote_write:
  - url: "http://remote-write-endpoint/api/v1/write"
    queue_config:
      capacity: 10000
      max_shards: 5
      min_shards: 1
