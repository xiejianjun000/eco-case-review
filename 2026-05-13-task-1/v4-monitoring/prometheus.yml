global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'v4-review-system'
    static_configs:
      - targets: ['v4-review:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
